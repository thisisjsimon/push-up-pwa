<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <rect width="192" height="192" rx="40" fill="#000000"/>
  <g transform="translate(96, 96)">
    <!-- Stylized push-up figure -->
    <circle cx="0" cy="-32" r="14" fill="#4a9eff"/>
    <!-- Body line -->
    <line x1="0" y1="-18" x2="0" y2="18" stroke="#4a9eff" stroke-width="6" stroke-linecap="round"/>
    <!-- Arms -->
    <line x1="0" y1="-8" x2="-26" y2="12" stroke="#4a9eff" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="-8" x2="26" y2="12" stroke="#4a9eff" stroke-width="5" stroke-linecap="round"/>
    <!-- Legs -->
    <line x1="0" y1="18" x2="-18" y2="40" stroke="#4a9eff" stroke-width="5" stroke-linecap="round"/>
    <line x1="0" y1="18" x2="18" y2="40" stroke="#4a9eff" stroke-width="5" stroke-linecap="round"/>
    <!-- Up arrow -->
    <polygon points="0,-56 -10,-46 10,-46" fill="#34c759"/>
  </g>
</svg>
